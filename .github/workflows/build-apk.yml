name: Build APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Locate sdkmanager
      id: sdk
      run: |
        if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
          echo "manager=$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" >> "$GITHUB_OUTPUT"
        elif [ -x "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager" ]; then
          echo "manager=$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager" >> "$GITHUB_OUTPUT"
        else
          find "$ANDROID_HOME" -name sdkmanager -type f 2>/dev/null || true
          exit 1
        fi
        echo "ANDROID_HOME=$ANDROID_HOME"

    - name: Accept Android SDK licenses
      run: yes | "${{ steps.sdk.outputs.manager }}" --licenses || true

    - name: Install Android SDK platform 33
      run: "${{ steps.sdk.outputs.manager }} platforms;android-33 build-tools;33.0.0"

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build debug APK
      run: ./gradlew :android:jdonkey:assembleBasicDebug

    - name: Find APK
      run: find . -name "*.apk" -type f

    - name: Copy APK to artifacts
      run: |
        mkdir -p artifacts
        find . -name "*.apk" -type f -exec cp {} artifacts/jed2k-debug.apk \;

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: jed2k-apk
        path: artifacts/*.apk
