name: Build APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Accept Android SDK licenses
      run: yes | sdkmanager --licenses || true

    - name: Install Android SDK platform 33
      run: sdkmanager "platforms;android-33" "build-tools;33.0.0"

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      continue-on-error: true

    - name: Generate Gradle wrapper
      run: gradle wrapper --gradle-version 7.6.4

    - name: Build debug APK
      run: ./gradlew :android:jdonkey:assembleBasicDebug

    - name: Find APK
      run: find . -name "*.apk" -type f

    - name: Copy APK to artifacts
      run: |
        mkdir -p artifacts
        find . -name "*.apk" -type f -exec cp {} artifacts/jed2k-debug.apk \;

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: jed2k-apk
        path: artifacts/*.apk
